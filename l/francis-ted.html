<!--
  Short link: https://thebelens.com/l/francis-ted/  ->  Pope Francis, TED2017.

  WHY A PAGE AND NOT A PLUGIN. jekyll-redirect-from would do this, but it is
  not in the Gemfile or in _config.yml plugins, and the site is built by
  .github/workflows/deploy.yml with `bundle exec jekyll build` and
  bundler-cache. Adding a gem means a Gemfile + Gemfile.lock change on a live
  site, and a bad lockfile fails the build and stops the deploy. One outbound
  link does not justify that. This page needs no plugin, no gem and no lockfile
  churn, and behaves identically.

  WHY A SHORT LINK AT ALL. Used instead of bit.ly: no third-party click
  tracker between a reader and the destination, and the target stays editable
  forever -- if TED moves the talk, fix it here and every published reference
  keeps working. That is the part a shortener cannot give back.

  noindex keeps this out of search results; canonical points crawlers at the
  real talk so no ranking is attributed here; sitemap:false keeps it out of
  sitemap.xml. The visible link is the fallback when meta-refresh is blocked.
-->
