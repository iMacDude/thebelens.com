# ============================================================
# thebelens.com — Jekyll Configuration
# ============================================================

# Site identity
title: The Belens
tagline: "Just an old Parts Guy — and proud of it."
description: >-
  John Belen writes honestly about 35+ years in automotive dealerships,
  technology, teaching, leadership, and the occasional hard-won lesson.
  From a parts counter in Michigan to directing Fixed Operations for 148
  dealerships nationwide. Cape Coral, Florida.
url: "https://thebelens.com"
baseurl: ""
lang: en_US

# Author — used by jekyll-seo-tag for structured data
author:
  name: John Belen
  # NO email key here on purpose. jekyll-feed copies site.author.email into
  # feed.xml as <author><email>, and RSS feeds are a standard harvest target
  # for address scrapers. Contact goes through the Formspree form instead.
  twitter: ""

# Social links — used by jekyll-seo-tag
social:
  name: John Belen
  links:
    - https://www.linkedin.com/in/johnbelen
    - https://thebelens.com

# Open Graph image — shown when someone shares the site on social.
# DISABLED until a real file exists. /assets/images/og-image.jpg was
# referenced here but never created, so this emitted a 404 URL into the
# JSON-LD publisher logo. Create a 1200x630 card, then uncomment.
# logo: /assets/images/og-image.jpg

# Google Search Console verification
# After claiming in GSC, paste your verification meta tag content here:
google_site_verification: "ZXean5KheAJg_YQRz5oJ1DxRe4Ot3K-neI-Kd75_QgA"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:slug/
timezone: America/New_York

# Plugins — all GitHub Pages whitelisted
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# jekyll-feed config
feed:
  title: "The Belens — From the Field"
  subtitle: >-
    John Belen writes honestly about automotive, technology,
    teaching, and the hard-won lessons of a 35-year career.
  path: feed.xml

# Front-matter defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: John Belen
      # NO default image here. _layouts/post.html guards on page.image being
      # SET, not on the file resolving — so a default pointing at a missing
      # file rendered a broken hero image on every post without its own art.
      # It did exactly that on three live posts. A post with no image should
      # simply have no hero. Set `image:` per post instead.

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - CLAUDE.md
  - .claude
  - extract_blog.py
  # Working source material. Underscore dirs are skipped by default;
  # naming it here too makes the intent explicit and survives a rename.
  - _content
  - historic-archive
